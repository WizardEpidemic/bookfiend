# Defines the local BookFiend application stack and its service dependencies.

services:
  postgres:
    image: postgres:17-alpine
    container_name: bookfiend-postgres
    environment:
      POSTGRES_DB: bookfiend
      POSTGRES_USER: bookfiend
      POSTGRES_PASSWORD: bookfiend_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookfiend -d bookfiend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: bookfiend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    image: bookfiend-api
    container_name: bookfiend-api
    environment:
      DATABASE_URL: postgresql+psycopg://bookfiend:bookfiend_dev@postgres:5432/bookfiend
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: bookfiend-api
    container_name: bookfiend-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://bookfiend:bookfiend_dev@postgres:5432/bookfiend
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: bookfiend-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data: