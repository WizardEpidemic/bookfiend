services:
  postgres:
    image: postgres:17-alpine
    container_name: bookfiend-postgres
    environment:
      POSTGRES_DB: bookfiend
      POSTGRES_USER: bookfiend
      POSTGRES_PASSWORD: bookfiend_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookfiend -d bookfiend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: bookfiend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: